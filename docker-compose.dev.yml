# MatHub - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:4910
#   pgAdmin: http://localhost:4911   (no sign-in; database password: mathub)
name: mathub-dev

services:
  web:
    image: ghcr.io/real-ttx/mathub:nightly
    restart: unless-stopped
    ports:
      - "4910:4910"
      - "69:4969/udp"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathub
      POSTGRES_USER: mathub
      POSTGRES_PASSWORD: mathub
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathub -d mathub"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4911:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mathub.example.com
      PGADMIN_DEFAULT_PASSWORD: mathub
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatHub", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "mathub", "Username": "mathub", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
