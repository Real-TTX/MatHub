# MatHub - Local (builds the image from this folder) with pgAdmin
#   ./scripts/redeploy.ps1              (rebuilds and starts the stack: the way to test every change)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:4910
#   pgAdmin:  http://localhost:4911   (no sign-in; database password: mathub)
#   Postgres: localhost:4912          (for "dotnet run" outside Docker, see appsettings.Development.json)
name: mathub-local

services:
  web:
    build: .
    image: mathub:local
    restart: unless-stopped
    ports:
      - "4910:4910"
      - "69:4969/udp"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "4912:5432"
    environment:
      POSTGRES_DB: mathub
      POSTGRES_USER: mathub
      POSTGRES_PASSWORD: mathub
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathub -d mathub"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4911:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mathub.example.com
      PGADMIN_DEFAULT_PASSWORD: mathub
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatHub (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "mathub", "Username": "mathub", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# A fixed subnet: on a machine with many stacks Docker runs out of address pools otherwise
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.91.0/24
